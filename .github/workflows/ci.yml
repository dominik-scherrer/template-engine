name: gate

on:
  push:
  pull_request:

jobs:
  round-trip-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # CI deliberately runs on the distro's pandoc, which is newer than the
      # pandoc used during development. The mapping layer detects the
      # pandoc-api-version at runtime (ADR-0012), so the gate passing here is
      # also a cross-version check of that claim.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Record pandoc version
        run: pandoc --version | head -1

      - name: Install project and dev tools
        run: python -m pip install -e ".[dev]" ruff mypy

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type-check
        run: mypy

      - name: Round-trip gate
        run: pytest -q --hypothesis-show-statistics
