[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "template-engine"
version = "0.0.0"
description = "Render freely structured content as .docx in a client template's appearance, by reusing the template's style definitions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
authors = [{ name = "Dominik Scherrer" }]
dependencies = ["python-docx>=1.1"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
]

[tool.hatch.build.targets.wheel]
packages = ["src/template_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["docx.*"]
ignore_missing_imports = true
